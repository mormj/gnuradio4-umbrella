name: integration

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out workspace repository
        uses: actions/checkout@v4

      - name: Bootstrap workspace
        shell: bash
        run: ./scripts/bootstrap.sh

      - name: Configure environment
        shell: bash
        run: source ./scripts/dev-env.sh && env | grep '^GR4_'

      - name: Build stack
        shell: bash
        run: source ./scripts/dev-env.sh && ./scripts/build-all.sh

      - name: Test stack
        shell: bash
        run: source ./scripts/dev-env.sh && ./scripts/test-all.sh
