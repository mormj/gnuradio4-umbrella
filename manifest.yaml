schema_version: 1
distribution: gnuradio4
version: 4.0.0-dev

components:
  - name: gnuradio4-core
    role: core
    repo: https://github.com/gnuradio/gnuradio4-core.git
    ref: main
    path: src/gnuradio4-core
    build_system: cmake
    required: true
    build_order: 10

  - name: gnuradio4-algorithm
    role: algorithm
    repo: https://github.com/gnuradio/gnuradio4-algorithm.git
    ref: main
    path: src/gnuradio4-algorithm
    build_system: cmake
    required: true
    build_order: 20
    depends_on:
      - gnuradio4-core

  - name: gnuradio4-blocks
    role: blocks
    repo: https://github.com/gnuradio/gnuradio4-blocks.git
    ref: main
    path: src/gnuradio4-blocks
    build_system: cmake
    required: true
    build_order: 30
    depends_on:
      - gnuradio4-core
      - gnuradio4-algorithm

