# Local workspace repository manifest.
# ref accepts a branch, tag, or commit SHA.
repos:
  - name: gnuradio4-core
    url: https://github.com/mormj/gnuradio4-core.git
    dest: src/gnuradio4-core
    ref: split_repos

  - name: gnuradio4-algorithm
    url: https://github.com/mormj/gnuradio4-algorithm.git
    dest: src/gnuradio4-algorithm
    ref: split_repos

  - name: gnuradio4-blocks
    url: https://github.com/mormj/gnuradio4-blocks.git
    dest: src/gnuradio4-blocks
    ref: split_repos

  - name: gr4-incubator
    url: https://github.com/gnuradio/gr4-incubator.git
    dest: src/gr4-incubator
    ref: main

  - name: gnuradio4-control-plane
    url: https://github.com/gnuradio/gnuradio4-control-plane.git
    dest: src/gnuradio4-control-plane
    ref: main

  - name: gnuradio4-studio
    url: https://github.com/gnuradio/gnuradio4-studio.git
    dest: src/gnuradio4-studio
    ref: main
